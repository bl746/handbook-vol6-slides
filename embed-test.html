<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embed test</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #f4f4f4; color: #222; }
    main { max-width: 900px; margin: 0 auto; padding: 32px 16px; background: #fff; }

    /* The snippet to paste into the host page: a 16:9 box that the deck fills. */
    .deck-embed { position: relative; width: 100%; aspect-ratio: 16 / 9; }
    .deck-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 1px solid #ddd; }

    .host-controls { display: flex; gap: 8px; align-items: center; margin-top: 8px; font: 14px system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Article title on egc.yale.edu</h1>
    <p>Stand-in for a page on the host site. The deck below is in an iframe, as it will be there.</p>

    <div class="deck-embed">
      <iframe src="index.html?v=2026-11-13g" title="Slides: Handbook of Development Economics introduction"
              allow="fullscreen" allowfullscreen loading="lazy"></iframe>
    </div>

    <!-- Optional: the host page can drive the deck and follow its position. -->
    <div class="host-controls">
      <button data-method="prev">Previous</button>
      <button data-method="next">Next</button>
      <span id="where"></span>
    </div>

    <p>(Test page only: stand-in for the host page's text after the deck.)</p>
  </main>

  <script>
    const frame = document.querySelector(".deck-embed iframe");
    document.querySelectorAll(".host-controls button").forEach((b) =>
      b.addEventListener("click", () =>
        frame.contentWindow.postMessage(JSON.stringify({ method: b.dataset.method }), "*")
      )
    );
    window.addEventListener("message", (e) => {
      if (e.source !== frame.contentWindow) return;
      const msg = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
      if (msg.namespace === "reveal" && msg.state) {
        document.getElementById("where").textContent =
          `Test page only: the host page sees slide ${msg.state.indexh + 1}`;
      }
    });
  </script>
</body>
</html>
